<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bee Honey | السلة</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 text-gray-900">
  <nav class="bg-green-600 p-3">
    <div class="container mx-auto flex justify-between items-center">
      <a href="#" class="text-white text-lg font-bold">Bee Honey</a>
      <ul class="flex space-x-4">
        <li><a href="index.html" class="text-white hover:text-gray-200">الرئيسية</a></li>
        <li><a href="shop.html" class="text-white hover:text-gray-200">المتجر</a></li>
        <li><a href="cart.html" class="text-white hover:text-gray-200">السلة</a></li>
        <li><a href="orders.html" class="text-white hover:text-gray-200">طلباتي</a></li>
      </ul>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">🧺 سلة المشتريات</h1>
    <table class="w-full bg-white rounded shadow">
      <thead class="bg-green-600 text-white">
        <tr>
          <th class="p-2">المنتج</th>
          <th class="p-2">السعر</th>
          <th class="p-2">الكمية</th>
          <th class="p-2">الإجمالي</th>
          <th class="p-2">إجراء</th>
        </tr>
      </thead>
      <tbody>
        <tr class="text-center border-t">
          <td class="p-2">عسل طبيعي</td>
          <td class="p-2">50 رس</td>
          <td class="p-2"><input type="number" value="1" class="w-16 border rounded text-center" /></td>
          <td class="p-2">50 رس</td>
          <td class="p-2"><button class="text-red-600 hover:underline">حذف</button></td>
        </tr>
      </tbody>
    </table>

    <div class="text-right text-xl font-bold mt-6 text-green-700">
      الإجمالي: 50 رس 💰
    </div>

    <div class="mt-4">
      <button class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">✅ تنفيذ الطلب</button>
    </div>
  </main>

  <footer class="bg-green-500 p-3 text-white text-center">
    <p>&copy; 2025 Bee Honey. جميع الحقوق محفوظة.</p>
  </footer>
