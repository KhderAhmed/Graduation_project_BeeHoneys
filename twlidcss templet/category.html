<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>

    <!-- Include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Categories</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Category Card 1 -->
            <div class="rounded-lg overflow-hidden shadow-lg">
                <img src="category1.jpg" alt="Category 1" class="w-full h-40 object-cover" />
                <div class="p-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-2">Category 1</h2>
                    <p class="text-gray-600">Explore products related to Category 1.</p>
                    <a href="#" class="block mt-2 text-blue-500 hover:underline">View Products</a>
                </div>
            </div>

            <!-- Category Card 2 -->
            <div class="rounded-lg overflow-hidden shadow-lg">
                <img src="category2.jpg" alt="Category 2" class="w-full h-40 object-cover" />
                <div class="p-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-2">Category 2</h2>
                    <p class="text-gray-600">Discover items from Category 2.</p>
                    <a href="#" class="block mt-2 text-blue-500 hover:underline">View Products</a>
                </div>
            </div>

            <!-- Add more category cards as needed -->

        </div>
    </div>

</body>

</html>
