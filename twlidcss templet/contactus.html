<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bee Honey</title>
        <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-gray-100 text-gray-900">
        <nav class="bg-green-600 p-3">
            <div class="container mx-auto flex justify-between items-center">
                <a href="#" class="text-white text-lg font-bold">Bee Honey</a>
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="text-white hover:text-gray-200">Home</a></li>
                    <li><a href="about.html" class="text-white hover:text-gray-200">About</a></li>
                    <li><a href="#" class="text-white hover:text-gray-200">Services</a></li>
                    <li><a href="contactus.html" class="text-white hover:text-gray-200">Contact</a></li>
                    <li><a href="login.html"
                            class="text-white hover:text-gray-200">Login</a></li>
                </ul>
            </div>
        </nav>
        <!-- <header class="bg-green-200 p-3 text-dark">
        <h1 class="text-3xl font-bold">Bee Honey</h1>
    </header> -->
        <main class="container mx-auto p-4">

            <section>
                <form class="bg-white p-6 rounded shadow-md">
                    <h2 class="text-2xl font-medium mb-4">Contact Us</h2>
                    <div class="mb-4">
                        <label for="name" class="block text-lg font-medium mb-2">Name</label>
                        <input type="text" id="name" name="name"
                            class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div class="mb-4">
                        <label for="email"
                            class="block text-lg font-medium mb-2">Email</label>
                        <input type="email" id="email" name="email"
                            class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div class="mb-4">
                        <label for="message"
                            class="block text-lg font-medium mb-2">Message</label>
                        <textarea id="message" name="message"
                            class="w-full p-2 border border-gray-300 rounded"></textarea>
                    </div>
                    <button type="submit"
                        class="bg-gray-600 text-white p-2 rounded">Send</button>
                </form>
            </section>
        </main>
        <footer class="bg-green-500 p-3 text-white text-center">
            <p>&copy; 2025 My Website. All rights reserved.</p>
        </footer>
    </body>
</html>
