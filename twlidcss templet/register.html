<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bee Honey</title>
        <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-gray-100 text-gray-900">

        <main class="container mx-auto p-6">

            <section>

                <form class="bg-white p-6 rounded shadow-md">
                    <h2 class="text-2xl font-medium mb-4">Create New Account</h2>
                    <div class="mb-4">
                        <div class="mb-4">
                            <label for="name" class="block text-lg font-medium mb-2">Name</label>
                            <input type="text" id="name" name="name" class="w-full p-2 border border-gray-300 rounded">
                        </div>
                        <label for="email"
                            class="block text-lg font-medium mb-2">Email</label>
                        <input type="email" id="email" name="email"
                            class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div class="mb-4">
                        <label for="name" class="block text-lg font-medium mb-2">Password</label>
                        <input type="text" id="name" name="name"
                            class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <button type="submit"
                        class="bg-green-700 text-white p-2 rounded">Register</button>

                    <div class="mb-4 ">
                    
                        <p class="text-blue-500 font-medium "> Have A Account : <a
                                class="text-md font-medium text-blue-600"
                                href="login.html">Login</a> </p>
                        
                           

                    </div>

                </form>

            </section>
        </main>
        
    </body>
</html>
