<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>

    <!-- Include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
    <!-- Search Label Container -->
    <div class="w-full max-w-md p-4 bg-white rounded-lg shadow-md">
        <label for="search" class="block text-sm font-medium text-gray-700 mb-2">
            Search
        </label>
        <div class="relative">
            <input
                type="text"
                id="search"
                placeholder="Search here..."
                class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            />
            <button
                type="button"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-white bg-blue-500 rounded-r-lg hover:bg-blue-600 focus:ring-2 focus:ring-blue-400 focus:outline-none"
            >
                Search
            </button>
        </div>
    </div>
</div>
</body>

</html>
