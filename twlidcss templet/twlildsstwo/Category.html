<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>

    <!-- Include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen">
<div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold text-green-800 mb-10 text-center">Explore Our Categories</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Category Card 1 -->
        <div class="rounded-2xl overflow-hidden shadow-lg bg-white hover:shadow-xl transition duration-300">
            <img src="category1.jpg" alt="Category 1" class="w-full h-48 object-cover">
            <div class="p-5">
                <h2 class="text-xl font-bold text-green-700 mb-2">Category 1</h2>
                <p class="text-gray-600">Explore products related to Category 1.</p>
                <a href="#" class="inline-block mt-4 text-green-600 hover:text-green-800 font-medium">View Products &rarr;</a>
            </div>
        </div>

        <!-- Category Card 2 -->
        <div class="rounded-2xl overflow-hidden shadow-lg bg-white hover:shadow-xl transition duration-300">
            <img src="category2.jpg" alt="Category 2" class="w-full h-48 object-cover">
            <div class="p-5">
                <h2 class="text-xl font-bold text-green-700 mb-2">Category 2</h2>
                <p class="text-gray-600">Discover items from Category 2.</p>
                <a href="#" class="inline-block mt-4 text-green-600 hover:text-green-800 font-medium">View Products &rarr;</a>
            </div>
        </div>

        <!-- Add more category cards as needed -->
    </div>
</div>
</body>

</html>
