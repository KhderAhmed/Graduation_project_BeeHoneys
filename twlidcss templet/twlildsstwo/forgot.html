<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bee Honey - Email Form</title>
    <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet"
    />
</head>
<body class="bg-gradient-to-br from-yellow-50 to-green-100 min-h-screen flex items-center justify-center">
<main class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Subscribe to Bee Honey</h2>

    <form class="space-y-6">
        <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email Address</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none"
                    required
            />
        </div>

        <button
                type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition duration-200"
        >
            Submit
        </button>
    </form>
</main>
</body>
</html>
