<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Honey - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center px-4 py-12">
    <section class="w-full max-w-md">
        <form class="bg-white p-8 rounded-2xl shadow-lg border-t-4 border-green-600">
            <h2 class="text-3xl font-bold text-center text-green-700 mb-6">Login to Bee Honey</h2>

            <div class="mb-4">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition">Login</button>

            <div class="mt-6 text-sm text-center">
                <a href="forgot.html" class="text-red-500 hover:text-red-600 font-medium">Forgot Password?</a>
            </div>
            <div class="mt-2 text-sm text-center">
                <span class="text-gray-600">Don't have an account?</span>
                <a href="register.html" class="text-blue-600 hover:text-blue-700 font-medium">Register</a>
            </div>
        </form>
    </section>
</main>

<footer class="bg-green-600 text-white text-center p-4">
    <p>&copy; 2025 Bee Honey. All rights reserved.</p>
</footer>
</body>

</html>
