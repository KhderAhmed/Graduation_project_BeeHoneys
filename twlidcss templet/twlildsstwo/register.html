<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Honey - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-yellow-50 to-green-100 text-gray-900 min-h-screen flex items-center justify-center">

<main class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">Create New Account</h2>

    <form>
        <div class="mb-5">
            <label for="name" class="block text-lg font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <div class="mb-5">
            <label for="email" class="block text-lg font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <div class="mb-5">
            <label for="password" class="block text-lg font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition">Register</button>

        <div class="mt-6 text-center">
            <p class="text-gray-700">Already have an account?
                <a href="login.html" class="text-green-600 font-semibold hover:underline">Login</a>
            </p>
        </div>
    </form>
</main>

</body>
</html>
