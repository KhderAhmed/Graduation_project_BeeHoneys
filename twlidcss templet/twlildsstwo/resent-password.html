<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Honey - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-yellow-50 to-green-100 text-gray-900 min-h-screen flex items-center justify-center">
<main class="w-full max-w-md px-6 py-8 bg-white rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">Reset Password</h2>

    <form class="space-y-5">
        <div>
            <label for="email" class="block text-lg font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
        </div>

        <div>
            <label for="password" class="block text-lg font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" id="password" name="password" placeholder="********"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
        </div>

        <div>
            <label for="confirm" class="block text-lg font-medium text-gray-700 mb-1">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="********"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-lg text-lg font-medium transition">Save</button>
    </form>
</main>
</body>
</html>
