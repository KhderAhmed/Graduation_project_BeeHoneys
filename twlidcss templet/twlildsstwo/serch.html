<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Page</title>

    <!-- Include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-yellow-50 to-green-100 min-h-screen flex items-center justify-center">
<!-- Search Box Container -->
<div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-6">
    <h2 class="text-2xl font-bold text-green-700 mb-4 text-center">Search Categories</h2>

    <div class="relative">
        <input
                type="text"
                id="search"
                placeholder="Search for honey products..."
                class="w-full px-5 py-3 text-sm border border-gray-300 rounded-full focus:ring-2 focus:ring-green-400 focus:outline-none shadow-sm"
        />
        <button
                type="button"
                class="absolute inset-y-0 right-0 mr-2 flex items-center px-4 text-white bg-green-500 rounded-full hover:bg-green-600 focus:ring-2 focus:ring-green-300 focus:outline-none"
        >
            Search
        </button>
    </div>
</div>
</body>

</html>
